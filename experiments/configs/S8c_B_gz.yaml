# Study 8c: tier B counterpart of the tier C held-out missions (docs/18_PROTOCOL_V8.md section 5), same planner as the
# tier C manager (journal_core/study8.solve8). Frozen before any study-8 held-out run.
frozen: true
heldout_seeds: {start: 17000, n: 20}
grid:
  name: s8c_heldout_B_gz
  split: heldout
  scales: [gz]
  exec: [high]
  lat: [none]
  kappas: [50]
  windows: [0.5]
  ms_per_task: 1.0
  methods: ["alns_fixed@40~z=0.5;lam=1;cost=fee+periodic:60", "alns_fixed@40~z=0.5;fb=nominal+periodic:60",
            "alns_fixed@40~prop=0.45;fb=none+periodic:60"]
  workers: 4
