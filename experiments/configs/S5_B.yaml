# Study 5, tier B (docs/13_PROTOCOL_V5.md): the cost-aware fallback against competitors tuned for each late cost.
# Frozen before any study-5 held-out run. Options inside a method are separated by ";". The tuned competitors are
# assembled per disturbance level in the analysis (journal_core/study5.TUNED), so every member they use is run at both
# levels.
frozen: true
heldout_seeds: {start: 10000, n: 30}
grid:
  name: s5_heldout_B
  split: heldout
  scales: [small, medium, large]
  exec: [mid, high]
  lat: [high]
  kappas: [10, 50, 200]
  windows: [1, 0.5]
  ms_per_task: 1.0
  methods:
    - "alns_fixed@40~z=auto4;lam=1+periodic:60"
    - "alns_fixed@40~z=auto4;lam=0.5+periodic:60"
    - "alns_fixed@40~z=auto4;lam=2+periodic:60"
    - "alns_fixed@40~z=auto4;fb=nominal+periodic:60"
    - "alns_fixed@40~z=0+periodic:60"
    - "alns_fixed@40~z=0.5+periodic:60"
    - "alns_fixed@40~z=1+periodic:60"
    - "alns_fixed@40~prop=0.45;fb=nominal+periodic:60"
    - "alns_fixed@40~prop=0.75;fb=nominal+periodic:60"
    - "alns_fixed@40~prop=0.3;fb=none+periodic:60"
    - "alns_fixed@40~prop=0.45;fb=none+periodic:60"
    - "alns_fixed@40~prop=0.75;fb=none+periodic:60"
    - "alns_fixed@40~mp=auto;fb=nominal+periodic:60"
    - "alns_fixed@40~mp=auto+periodic:60"
    - "alns_fixed@40~buf=60+periodic:60"
    - "alns_fixed@40+periodic:60"
    - "alns_fixed@40+event"
  workers: 4
