# Study 3, tier B (docs/10_PROTOCOL_V3.md): proposed replanner with a nominal fallback. Frozen before any study-3
# held-out run. The first method is the fallback variant analysed by experiments/analyze_study3.py.
frozen: true
heldout_seeds: {start: 7000, n: 30}
grid:
  name: s3_heldout_B
  split: heldout
  scales: [small, medium, large]
  exec: [mid, high]
  lat: [high]
  kappas: [10, 50, 200]
  windows: [1, 0.5]
  ms_per_task: 1.0
  methods:
    - "proposed~fb=nominal+periodic:60"
    - "proposed+periodic:60"
    - "alns_fixed@40~buf=60+periodic:60"
    - "alns_fixed@40+periodic:60"
    - "alns_fixed@40+event"
  workers: 4
